<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Damiet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 모바일 전용 헤더 -->
  <header class="mobile-header">
    <button class="hamburger-btn" id="toggleBtn" aria-label="메뉴 열기">☰</button>
    <div class="mobile-logo">✨ Damiet</div>
    <div style="width: 32px;"></div>
  </header>

  <!-- 사이드바 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">✨ Damiet</div>
    <nav>
      <ul class="nav-list">
        <li><a href="#" class="nav-item active"><span>⊞</span> 대시보드</a></li>
        <li><a href="#" class="nav-item"><span>📅</span> 한달 달력</a></li>
        <li><a href="#" class="nav-item"><span>🍴</span> 식단 기록</a></li>
        <li><a href="#" class="nav-item"><span>🏋️</span> 운동 기록</a></li>
        <li><a href="#" class="nav-item"><span>⚖️</span> 체중 변화</a></li>
        <li><a href="#" class="nav-item"><span>📖</span> 하루 마무리</a></li>
      </ul>
    </nav>
    <button class="demo-btn">✨ 데모 데이터 생성</button>
  </aside>

  <!-- 모바일 사이드바 열릴 때 배경 어둡게 처리 -->
  <div class="overlay" id="overlay"></div>

  <!-- 메인 콘텐츠 영역 -->
  <main class="main-content">
    <h1>대시보드</h1>
    <p style="margin-top: 8px; color: #8c7a6b;">오늘의 다이어트 여정을 체크하세요.</p>
    
    <div style="margin-top: 24px; padding: 20px; background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
      <h3>칼로리 밸런스</h3>
      <p style="margin-top: 12px;">모바일에서도 메인 화면이 전체 너비로 깔끔하게 보입니다.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
